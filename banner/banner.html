<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>家具のソムリエ SOY2026 投票バナー 1600×311</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<style>
@page{size:1600px 311px;margin:0}
:root{--red:#c8102e;--red-d:#8e0b20;--gold:#d6b06a;--gold-l:#f2dfb0;--gold-d:#9c7a3c;--gold-grad:linear-gradient(180deg,#fff4d6 0%,#f2dfb0 30%,#d6b06a 62%,#9c7a3c 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:311px;overflow:hidden;background:#000}
body{font-family:"Noto Sans JP",sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bn{position:relative;width:1600px;height:311px;overflow:hidden;display:grid;grid-template-columns:270px 1fr 660px;align-items:center;padding:0 46px 0 34px;background:#000}
.bn::before{content:"";position:absolute;inset:10px;border:1px solid rgba(214,176,106,.45);border-radius:14px;pointer-events:none}
.l{position:relative;text-align:center}
.l svg{width:170px;height:auto;display:block;margin:0 auto}
.l .shop{margin-top:6px;font-weight:700;font-size:20px;letter-spacing:.2em;padding-left:.2em}
.c{position:relative;text-align:center}
.c .soy{font-family:"Jost",sans-serif;font-weight:500;font-size:22px;letter-spacing:.16em;color:var(--gold-l);white-space:nowrap}
.c .soy b{font-weight:600;font-size:1.3em;letter-spacing:.06em;margin-left:.3em;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.c .ttl{font-weight:900;font-size:96px;line-height:1.1;letter-spacing:0;white-space:nowrap;margin-top:4px}
.r{position:relative}
.pt{border:1.5px solid var(--gold);border-radius:16px;background:#000;padding:14px 22px 18px;text-align:center;line-height:1.35;white-space:nowrap}
.pt .a{font-weight:900;font-size:40px}
.pt .a b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.5em;color:var(--gold-l)}
.pt .a small{font-size:.75em}
.pt .b{font-weight:700;font-size:31px;margin-top:4px}
.pt .b b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.25em;color:var(--gold-l)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:20px;white-space:nowrap}
.dl{font-weight:700;font-size:23px;color:rgba(255,255,255,.85)}
.dl b{font-family:"Jost",sans-serif;font-weight:600;font-size:1.4em;color:var(--gold-l)}
.cta{display:inline-flex;align-items:center;gap:10px;border-radius:999px;background:var(--gold-grad);color:#120a0b;font-weight:700;font-size:27px;letter-spacing:.08em;padding:11px 14px 11px 32px;box-shadow:0 5px 0 var(--gold-d)}
.cta i{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-style:normal;font-size:15px}
</style>
</head>
<body>
<div class="bn">

  <div class="l">
    <svg viewBox="0 -86 240 286" aria-hidden="true">
      <defs>
        <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f45a6f"/><stop offset="1" stop-color="#c8102e"/></linearGradient>
        <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d81a36"/><stop offset=".55" stop-color="#b00e27"/><stop offset="1" stop-color="#7c0919"/></linearGradient>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4d6"/><stop offset=".35" stop-color="#f2dfb0"/><stop offset=".7" stop-color="#d6b06a"/><stop offset="1" stop-color="#9c7a3c"/></linearGradient>
        <clipPath id="slot"><rect x="0" y="-90" width="240" height="127"/></clipPath>
      </defs>
      <g clip-path="url(#slot)"><rect x="80" y="-74" width="80" height="104" rx="4" fill="#fff" stroke="#d6b06a" stroke-width="2"/><rect x="80" y="-74" width="80" height="14" fill="#c8102e"/><circle cx="120" cy="-24" r="18" fill="none" stroke="#c8102e" stroke-width="3"/><path d="M111 -24 l7 7 l12 -14" fill="none" stroke="#c8102e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
      <ellipse cx="120" cy="192" rx="112" ry="8" fill="rgba(0,0,0,.5)"/>
      <polygon points="40,22 200,22 226,52 14,52" fill="url(#t)" stroke="#d6b06a" stroke-width="2" stroke-linejoin="round"/>
      <rect x="70" y="33" width="100" height="8" rx="4" fill="#2a0208"/>
      <rect x="14" y="52" width="212" height="136" rx="6" fill="url(#f)" stroke="#d6b06a" stroke-width="2.5"/>
      <rect x="28" y="66" width="184" height="108" rx="3" fill="none" stroke="rgba(242,223,176,.45)" stroke-width="1"/>
      <text x="120" y="130" text-anchor="middle" font-family="Jost,sans-serif" font-weight="600" font-size="46" letter-spacing="6" fill="url(#g)">VOTE</text>
      <text x="120" y="154" text-anchor="middle" font-family="Jost,sans-serif" font-weight="500" font-size="11" letter-spacing="3" fill="#f2dfb0">SHOP OF THE YEAR</text>
    </svg>
    <p class="shop">家具のソムリエ</p>
  </div>

  <div class="c">
    <p class="soy">RAKUTEN SHOP OF THE YEAR<b>2026</b></p>
    <p class="ttl">投票受付中！</p>
  </div>

  <div class="r">
    <div class="pt">
      <p class="a">最大<b>10,000</b><small>ポイント</small>！</p>
      <p class="b">合計<b>10</b>万名様に当たる！</p>
    </div>
    <div class="meta"><p class="dl">投票は<b>11.30</b>(月)09:59まで</p><span class="cta">投票はこちら<i>▶</i></span></div>
  </div>
</div>
</body>
</html>
